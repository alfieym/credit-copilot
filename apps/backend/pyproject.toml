[project]
name = "credit-copilot"
version = "0.1.0"
description = "信贷分析师 Copilot：面向对公信贷域的多工具 RAG + Text-to-SQL Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.66",
    "openai-agents>=0.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "sqlalchemy>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "langfuse>=2.50",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[project.optional-dependencies]
# Claude via AWS Bedrock（欧美主流多云路径；按需安装，避免拉入 boto3）
bedrock = ["boto3>=1.34"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/credit_copilot"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
